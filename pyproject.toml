[project]
name = "nats-nsc"
version = "0.4.1"


description = "Limited python nsc utility equivalent, for user creation and signing JWTs."
authors = [
    {name = "Mikołaj Nowak", email = "12396461+m3nowak@users.noreply.github.com"},
]
dependencies = [
    "pyJWT~=2.6.0",
    "aiofiles~=23.1.0",
    "nkeys>=0.1,<0.3",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.4.3",
    "mkdocstrings[python]>=0.21.2",
    "pyright>=1.1.400",
    "pytest>=7.3.1",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = [
  "src/"
]
